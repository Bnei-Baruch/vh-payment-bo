services:
  vh-payment-bo:
    container_name: vh-payment-bo
    image: "${IMAGE_NAME}"
    restart: unless-stopped
    cpus: '0.1'
    mem_limit: 50M
    ports:
      # Bound to loopback: host nginx is the only thing that talks to this, and
      # firewalld is disabled on the Rocky 9 hosts, so a 0.0.0.0 mapping would
      # publish it straight onto the VM's public IP, bypassing the LB and nginx.
      - 127.0.0.1:8087:80
    volumes:
      # Must match the gomplate --output-map path in the workflow. If the two
      # drift apart nothing errors: gomplate renders into one directory, nginx
      # serves an empty one, and the app silently falls back to the stale
      # defaults in config-templates/config.js.
      - /root/vh-docker/apps/vh-payment-bo/public/config/:/usr/share/nginx/html/config/
networks:
  default:
    name: vh
    external: true
